[package]
name = "opencode-gpui"
version = "0.1.0"
edition = "2024"
rust-version = "1.93"
description = "A native GPUI client for OpenCode"
license = "MIT"
readme = "README.md"
repository = "https://github.com/0916dhkim/opencode-gpui"

[dependencies]
anyhow = "1.0"
ashpd = { version = "0.13.13", default-features = false, features = ["notification", "async-io"] }
async-channel = "2.3"
base64 = "0.22"
clap = { version = "4.5", features = ["derive", "env"] }
dirs = "6.0"
env_logger = "0.11"
futures-util = "0.3"
futures-lite = "2.6"
jiff = "0.2"
keyring = { version = "3.6", features = ["crypto-rust", "sync-secret-service"] }
gpui-kit = { version = "0.7.1", features = ["profiler"] }
imagesize = "0.14"
log = "0.4"
mime_guess = "2.0"
pulldown-cmark = { version = "0.13", default-features = false }
rfd = { version = "0.15", default-features = false, features = ["xdg-portal", "tokio"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls-native-roots"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tempfile = "3.14"
url = "2.5"

[dev-dependencies]
ttf-parser = "0.25"
zbus = { version = "5.19", default-features = false, features = ["async-io"] }

[patch.crates-io]
# Component's stock Root paints an opaque surface and adds a 20px window
# border outside every Client window. Keep its plugins, but allow this app to
# provide the transparent, rounded client frame instead.
gpui-component = { path = "vendor/gpui-component" }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
