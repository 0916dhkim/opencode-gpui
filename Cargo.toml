[package]
name = "opencode-gpui"
version = "0.1.0"
edition = "2024"
rust-version = "1.93"
description = "A native GPUI client for OpenCode"
license = "MIT"
readme = "README.md"
repository = "https://github.com/0916dhkim/opencode-gpui"

[dependencies]
anyhow = "1.0"
async-channel = "2.3"
base64 = "0.22"
clap = { version = "4.5", features = ["derive", "env"] }
dirs = "6.0"
env_logger = "0.11"
jiff = "0.2"
keyring = { version = "3.6", features = ["crypto-rust", "sync-secret-service"] }
gpui-kit = "0.7.1"
imagesize = "0.14"
log = "0.4"
mime_guess = "2.0"
pulldown-cmark = { version = "0.13", default-features = false }
rfd = { version = "0.15", default-features = false, features = ["xdg-portal", "tokio"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls-native-roots"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tempfile = "3.14"
tokio = { version = "1", features = ["sync", "time", "rt"] }
url = "2.5"

[dev-dependencies]
gpui-kit = { version = "0.7.1", features = ["test-support"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
