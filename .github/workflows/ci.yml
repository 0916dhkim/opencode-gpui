name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@ce678459e9fc7500d337468f904b95f1b5c10b5e # pinned action
        with:
          toolchain: stable
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake fonts-noto-core libdbus-1-dev libexpat1-dev \
            libfontconfig1-dev libfreetype6-dev libgl1-mesa-dev libssl-dev \
            libwebkit2gtk-4.1-dev libxkbcommon-dev libxkbcommon-x11-dev \
            libwayland-dev libx11-xcb-dev libzstd-dev libvulkan1 \
            mesa-vulkan-drivers pkg-config python3 weston xvfb xdotool \
            x11-utils imagemagick
      - name: Format
        run: cargo fmt --all -- --check
      - name: Lint
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: Test
        run: cargo test --all-targets --locked
      - name: Fake v2 server self-test
        run: python3 tests/fake_v2/selftest.py
      - name: Build GPUI client
        run: cargo build --locked
      - name: Headless smoke test
        run: SMOKE_BINARY="$PWD/target/debug/opencode-gpui" bash tests/smoke-ui.sh
      - name: Headless keyboard-shortcut test
        run: SHORTCUT_BINARY="$PWD/target/debug/opencode-gpui" bash tests/shortcut-ui.sh
      - name: Headless fake-server UI flow
        run: FLOW_BINARY="$PWD/target/debug/opencode-gpui" bash tests/remote-flow-ui.sh
      # The real OpenCode 2.0.8 end-to-end run (tests/v2/e2e.sh) needs Docker and
      # downloads the pinned CLI when its image is built, so it runs locally only.
