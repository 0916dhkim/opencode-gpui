name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@ce678459e9fc7500d337468f904b95f1b5c10b5e # pinned action
        with:
          toolchain: stable
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
        with:
          key: checks
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake dbus-daemon libdbus-1-dev libexpat1-dev libfontconfig1-dev \
            libfreetype6-dev libgl1-mesa-dev libssl-dev \
            libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev \
            libx11-xcb-dev libzstd-dev libvulkan1 mesa-vulkan-drivers pkg-config
      - name: Format
        run: cargo fmt --all -- --check
      - name: Lint
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: Test
        run: cargo test --all-targets --locked
      - name: Isolated notification portal roundtrip
        run: dbus-run-session -- cargo test --locked --lib notification_portal_roundtrip -- --ignored

  fake-server:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Fake v2 server self-test
        run: python3 tests/fake_v2/selftest.py

  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@ce678459e9fc7500d337468f904b95f1b5c10b5e # pinned action
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
        with:
          key: client-binary
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake libdbus-1-dev libexpat1-dev libfontconfig1-dev \
            libfreetype6-dev libgl1-mesa-dev libssl-dev \
            libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev \
            libx11-xcb-dev libzstd-dev libvulkan1 mesa-vulkan-drivers pkg-config
      - name: Build GPUI client
        run: cargo build --locked

# Automated headless GUI cases are intentionally absent. Visual capture/input
# tooling remains for agent-directed checks; CI runs non-GUI tests and a build.
